name: Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches both Cargo.toml versions
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VER_MAIN=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          VER_MACROS=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' anti-dbg-macros/Cargo.toml | head -1)
          echo "tag=$TAG anti-dbg=$VER_MAIN anti-dbg-macros=$VER_MACROS"
          if [ "$TAG" != "$VER_MAIN" ] || [ "$TAG" != "$VER_MACROS" ]; then
            echo "::error::Tag v$TAG must equal both Cargo.toml versions"
            exit 1
          fi

  test:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --all-targets
      - run: cd anti-dbg-macros && cargo test --all-features --all-targets

  publish-macros:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Dry run (anti-dbg-macros)
        run: cd anti-dbg-macros && cargo publish --dry-run
      - name: Publish anti-dbg-macros
        run: cd anti-dbg-macros && cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-anti-dbg:
    needs: publish-macros
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Dry run (anti-dbg)
        run: cargo publish --dry-run
      - name: Publish anti-dbg
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
